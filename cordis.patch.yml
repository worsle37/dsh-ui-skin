# ============================================================================
# dsh-ui-skin —— DSH 外观皮肤插件
# ============================================================================
# 这一行把「Host 半」挂进 profile；它的 Config 同时成为设置命名空间
# `dsh-ui-skin`（浏览器半用 ctx.configForms 读写）。
#
# 安装：dsh plugin --profile desktop add link:<本目录绝对路径>
# 或   Plugins / 插件页 → Add plugin → 选本目录
# ============================================================================

- insert:
    - id: dsh-ui-skin
      name: dsh-ui-skin
